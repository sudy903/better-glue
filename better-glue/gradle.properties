# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# 本机到 maven.fabricmc.net 的连接很不稳定，放宽超时并降低并发
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.repository.max.tentatives=8
# 受限环境里原生文件监视会失败（Couldn't open current thread），关掉更稳
org.gradle.vfs.watch=false

# ---------------------------------------------------------------------------
# 代理（如果需要）
#
# Gradle 不会读系统代理，也不会读 HTTP_PROXY 环境变量，只认这里的 systemProp。
# 开了 Clash / v2rayN / Steam++ 的"全局/TUN"后，把下面四行的注释去掉，
# 端口改成你代理软件里的 HTTP 端口（Clash 常见 7890，v2rayN 常见 10808/10809）。
#
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890
#
# 如果代理是 SOCKS5 且软件同时开了 HTTP 端口，用 HTTP 端口即可；
# 只监听 SOCKS 的话，先确认它有 http 混合端口，否则 Gradle 用不了。
# ---------------------------------------------------------------------------

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.10
yarn_mappings=1.21.10+build.3
loader_version=0.20.1
# 1.19.x 的 loom 需要 JDK 25；1.17.3 只要 JDK 21，功能和 1.21.10 兼容
loom_version=1.17.3

# Mod Properties
version=1.0.0
group=sudy.sudy

# Dependencies
fabric_api_version=0.138.4+1.21.10
create_fly_version=1.21.10-6.0.8-6
